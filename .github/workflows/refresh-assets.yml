name: Refresh English Course Assets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "После замены изображений введите REFRESH"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: english-course-assets-refresh
  cancel-in-progress: false

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Confirm refresh
        env:
          REFRESH_CONFIRM: ${{ inputs.confirm }}
        run: test "$REFRESH_CONFIRM" = "REFRESH"

      - name: Refresh media hashes
        run: python scripts/refresh_asset_hashes.py

      - name: Verify package
        run: python tests/test_package.py

      - name: Commit refreshed hashes
        run: |
          if git diff --quiet -- content; then
            echo "Хеши уже актуальны. Изменений нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/season1.json content/season2.json content/season3.json
          git commit -m "Refresh course media hashes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
