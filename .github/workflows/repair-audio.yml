name: Repair English Course Audio

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Введите REPAIR"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: english-course-audio-repair
  cancel-in-progress: false

jobs:
  repair-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Confirm repair
        env:
          REPAIR_CONFIRM: ${{ inputs.confirm }}
        run: test "$REPAIR_CONFIRM" = "REPAIR"

      - name: Install FFmpeg when missing
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Re-encode all MP3 for Telegram compatibility
        run: bash scripts/repair_audio.sh

      - name: Refresh media hashes
        run: python scripts/refresh_asset_hashes.py

      - name: Verify repaired package
        run: python tests/test_package.py

      - name: Commit repaired audio
        run: |
          if git diff --quiet -- audio content; then
            echo "Аудиофайлы уже совместимы. Изменений нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio content/season1.json content/season2.json
          git commit -m "Repair MP3 compatibility for Telegram clients"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
